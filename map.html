<html lang="zh-CN">

<title>怀安在线 · 探索地图</title>
<style>
  :root{
    --bg:#0c0d11; --panel:#131419; --panel2:#17181f; --ink:#e8e8ec; --ink-dim:#a6a6b0;
    --ink-faint:#6c6c78; --line:#23242d; --acc:#6fb1ff; --acc2:#7fe0c0; --warn:#ff9d6b;
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
    --serif:"Noto Serif SC","Songti SC",STSong,SimSun,serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:15px;
    line-height:1.8;-webkit-font-smoothing:antialiased;}
  #topbar{position:sticky;top:0;z-index:40;background:#0d0e13;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap;}
  #brand{font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:8px;}
  #brand .gl{width:18px;height:18px;border-radius:4px;background:linear-gradient(135deg,#2a2a33,#3a3a45);
    display:grid;place-items:center;font-size:11px;color:var(--acc);border:1px solid #2f2f3a;}
  .grow{flex:1;}
  .tbtn{background:transparent;border:1px solid #2a2a33;color:var(--ink-dim);padding:7px 13px;
    border-radius:8px;cursor:pointer;font-size:13px;font-family:var(--serif);transition:.15s;}
  .tbtn:hover{border-color:var(--acc);color:var(--acc);}
  #progress{font-family:var(--mono);font-size:12px;color:var(--ink-faint);min-width:140px;text-align:right;}
  .wrap{max-width:1040px;margin:0 auto;padding:18px 16px 70px;}
  h1{font-size:21px;margin:6px 0 2px;}
  .sub{color:var(--ink-faint);font-family:var(--mono);font-size:12.5px;margin-bottom:14px;}

  /* 进度条 */
  .bar{height:10px;border-radius:99px;background:#15151c;border:1px solid var(--line);overflow:hidden;margin:6px 0 4px;}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px;transition:width .4s;}
  .stats{font-family:var(--mono);font-size:12.5px;color:var(--ink-dim);display:flex;gap:18px;flex-wrap:wrap;}
  .stats b{color:var(--acc2);}

  /* 流程说明 */
  .howto{border:1px solid #2c2c36;background:#0f0f15;border-radius:11px;padding:14px 16px;margin:18px 0;font-size:13.5px;color:var(--ink-dim);line-height:1.9;}
  .howto b{color:var(--acc);font-family:var(--mono);}

  /* 推荐主线条 */
  .sec-t{font-size:14px;color:var(--ink-dim);margin:24px 0 10px;padding-left:10px;border-left:3px solid var(--acc);font-family:var(--mono);}
  .path{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .pc{padding:7px 12px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;background:var(--panel);color:var(--ink-faint);cursor:pointer;transition:.15s;}
  .pc.done{border-color:var(--acc);color:var(--ink);}
  .pc.cur{border-color:var(--warn);color:var(--warn);box-shadow:0 0 0 2px rgba(255,157,107,.2);}
  .pc.undim{opacity:.5;}
  .pc:hover{filter:brightness(1.12);}
  .arrow{color:var(--ink-faint);font-size:12px;}

  /* 分层流程图 */
  .flow{display:flex;gap:0;align-items:stretch;overflow-x:auto;padding:6px 2px 12px;}
  .col{flex:1;min-width:172px;display:flex;flex-direction:column;}
  .col-h{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);text-align:center;padding:6px 4px 10px;border-bottom:1px solid var(--line);margin-bottom:10px;}
  .col-sep{display:flex;align-items:center;color:var(--ink-faint);font-size:14px;padding:0 4px;}
  .node{border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin:0 4px 9px;background:var(--panel);font-size:13px;color:var(--ink-faint);cursor:pointer;transition:.15s;position:relative;}
  .node:hover{filter:brightness(1.12);}
  .node .tag{display:block;font-family:var(--mono);font-size:10.5px;margin-top:5px;opacity:.8;}
  .node .leads{display:block;font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);margin-top:4px;line-height:1.5;}
  .node.done{border-color:var(--acc);color:var(--ink);background:#101820;}
  .node.done .tag{color:var(--acc2);}
  .node.cur{border-color:var(--warn);color:var(--warn);background:#1c1410;box-shadow:0 0 0 2px rgba(255,157,107,.18);}
  .node.cur .tag{color:var(--warn);}
  .node.miss{opacity:.62;}

  /* 漏掉清单 */
  .missed{border:1px solid var(--line);border-radius:11px;background:var(--panel);padding:14px 16px;margin-top:8px;}
  .missed ul{margin:8px 0 0;padding-left:18px;font-size:13.5px;color:var(--ink-dim);line-height:1.9;}
  .missed li b{color:var(--warn);font-family:var(--mono);cursor:pointer;}
  .missed li b:hover{text-decoration:underline;}
  .note{color:var(--ink-faint);font-size:12px;margin-top:10px;font-family:var(--mono);}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-dim);margin-top:6px;font-family:var(--mono);}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:5px;border:1px solid var(--line);}
  .legend .d{background:#101820;border-color:var(--acc);}
  .legend .c{background:#1c1410;border-color:var(--warn);}
  .legend .m{background:var(--panel);}
  #toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(14px);background:var(--acc);
    color:#0a0a0c;border-radius:20px;padding:9px 18px;font-size:13px;font-weight:600;z-index:60;opacity:0;
    pointer-events:none;transition:.25s;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>

/* 当前位置：取最靠后到达的界面 */
function loadFound(){
  const s=new Set();
  try{
    const raw=localStorage.getItem(SAVE_KEY); if(!raw) return s;
    const d=JSON.parse(raw); if(Array.isArray(d.f)) d.f.forEach(x=>s.add(x));
  }catch(e){}
  return s;
}
function isDone(n,found){ return n.always || found.has(n.id); }

function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200);
}
/* 背景容器节点（四大站点 / 地情背景）：点击直接打开对应网页，与站点里关键词的行为一致 */
function isBgNode(id){ return /^[SB]/.test(id); }
function openNode(n,found){
  const rt=NODE_OPEN[n.id];
  if(rt && (isDone(n,found) || isBgNode(n.id))){
    window.open(rt[0]+'?node='+encodeURIComponent(n.id)+(rt[1]?('#'+rt[1]):''),'_blank','noopener'); return;
  }
  if(!n.search){ toast('暂时没有可直接检索的词'); return; }
  window.open('browser.html?q='+encodeURIComponent(n.search),'_blank','noopener');
}
function openNodeById(id){ const n=NODES.find(x=>x.id===id); if(n) openNode(n, loadFound()); }

function render(){
  const found=loadFound();
  const total=NODES.length;
  const done=NODES.filter(n=>isDone(n,found)).length;
  const miss=total-done;

  document.getElementById('progress').textContent='进度 '+done+' / '+total;
  document.getElementById('barfill').style.width=(done/total*100).toFixed(0)+'%';
  document.getElementById('stats').innerHTML=
    '已解锁 <b>'+done+'</b> 个界面　·　漏了 <b>'+miss+'</b> 个　·　通关需到达「终章」';

  /* 当前位置 */
  let curId=null;
  for(let i=NODES.length-1;i>=0;i--){ if(isDone(NODES[i],found)){ curId=NODES[i].id; break; } }

  /* 分层流程图 */
  const flowEl=document.getElementById('flow'); flowEl.innerHTML='';
  for(let L=0;L<5;L++){
    const col=document.createElement('div'); col.className='col';
    const h=document.createElement('div'); h.className='col-h'; h.textContent=LAYER_NAME[L]; col.appendChild(h);
    NODES.filter(n=>n.layer===L).forEach(n=>{
      const d=isDone(n,found); const cur=(n.id===curId);
      const card=document.createElement('div');
      card.className='node '+(d?(cur?'cur':'done'):'miss');
      card.innerHTML='<div>'+n.name+'</div>'+
        '<span class="tag">'+(d?(cur?'● 当前位置':'✓ 已到达'):'○ 未到达')+'</span>';
      card.onclick=()=>openNode(n,found);
      col.appendChild(card);
    });
    flowEl.appendChild(col);
    if(L<4){ const sep=document.createElement('div'); sep.className='col-sep'; sep.textContent='→'; flowEl.appendChild(sep); }
  }

  /* 漏掉清单 */
  const missedEl=document.getElementById('missed');
  const missNodes=NODES.filter(n=>!isDone(n,found));
  if(missNodes.length===0){
    missedEl.innerHTML='<div style="color:var(--acc2);font-size:14px">全部界面已到达，恭喜通关 ◎</div>';
  }else{
    missedEl.innerHTML='<div style="font-size:13px;color:var(--ink-dim)">共 '+missNodes.length+' 个界面还没到达：</div>'+
      '<ul>'+missNodes.map(n=>'<li><b onclick="openNodeById(\''+n.id+'\')">'+n.name+'</b></li>').join('')+'</ul>';
  }
  document.getElementById('notefoot').textContent='进度来自浏览器写入的本地存档，与浏览器实时同步。';
}

/* 同步：浏览器检索写入 localStorage 后，本页实时刷新 */
window.addEventListener('storage',e=>{ if(e.key===SAVE_KEY||e.key===null) render(); });
window.addEventListener('focus',render);
render();
</script>
</body>
</html>
