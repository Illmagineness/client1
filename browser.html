]);
const ALLKW = (function(){ const s=new Set(); SEARCH_INDEX.forEach(e=>e.k.forEach(k=>{ if(k.length>=2 && !EXCLUDE_KW.has(k)) s.add(k); })); return [...s].sort((a,b)=>b.length-a.length); })();
function highlightKeywords(root){
  const walker=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n=>{
    const text=n.nodeValue; const ranges=[]; let changed=false;
    for(const w of ALLKW){ if(w.length<2) continue; let i=0;
      while((i=text.indexOf(w,i))!==-1){ ranges.push([i,i+w.length]); i+=w.length; changed=true; } }
    if(!changed) return;
    ranges.sort((a,b)=> a[0]-b[0] || (b[1]-b[0])-(a[1]-a[0]));
    const merged=[]; for(const r of ranges){ if(merged.length && r[0]<merged[merged.length-1][1]) continue; merged.push(r); }
    const frag=document.createDocumentFragment(); let pos=0;
    merged.forEach(([s,e])=>{
      if(s>pos) frag.appendChild(document.createTextNode(text.slice(pos,s)));
      const b=document.createElement('b'); b.className='kw'; b.textContent=text.slice(s,e); frag.appendChild(b); pos=e;
    });
    if(pos<text.length) frag.appendChild(document.createTextNode(text.slice(pos)));
    n.parentNode.replaceChild(frag, n);
  });
}

  }catch(e){}
}
function loadProgress(){
  try{ const raw=localStorage.getItem(SAVE_KEY); if(!raw) return; const d=JSON.parse(raw);
    if(Array.isArray(d.f)) d.f.forEach(x=>found.add(x));
    if(Array.isArray(d.l)) log.push(...d.l.slice(0,60));
  }catch(e){}
}
function updateProgress(){
  let done=0; for(const id of NODE_IDS){ if(id==='__browser__'||found.has(id)) done++; }
  const el=document.getElementById('progress'); if(el) el.textContent = done+' / '+NODE_TOTAL;
}

/* ====================== 5. 检索匹配 ====================== */
function matchAll(q){
  q=(q||'').trim(); if(!q) return [];
  const out=[]; const seen=new Set();
  for(const e of SEARCH_INDEX){
    let hit=false;
    for(const k of e.k){ if(k===q || q.includes(k) || k.includes(q)){ hit=true; break; } }
    if(hit){ if(seen.has(e.p)) continue; seen.add(e.p); out.push(e); }
  }
  out.sort((a,b)=> rank(b,q)-rank(a,q));
  return out;
}
function rank(e,q){ return e.k.some(k=>k===q)?2:(e.k.some(k=>q.includes(k)||k.includes(q))?1:0); }

/* ====================== 6. 视口切换 ====================== */
function showInline(){ pageEl.style.display='block'; }
function setAddr(v){
  addrEl.value=v||'';
  const t=document.getElementById('tabtitle');
  if(t) t.textContent = (!v || v==='about:home') ? '怀安在线 · 起始页' : String(v).replace(/^search:\s*/,'检索：');
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function siteNameOf(file){
  if(!file) return '';
  if(file.indexOf('sites/archive/')===0) return '怀安县数字方志馆';
  if(file.indexOf('sites/news/')===0) return '怀安新闻网';
  if(file.indexOf('sites/tieba/')===0) return '怀安贴吧';
  if(file.indexOf('sites/wx/')===0) return '怀安发布';
  if(file.indexOf('sites/web/')===0) return '散落的旧网页';
  if(file.indexOf('truth/')===0) return '未公开整理稿';
  if(file.indexOf('sites/blog/')===0) return '江边旧事';
  return '';
}

function applyResults(q, entries){
  showInline();
  let html = `<div class="sr-h">搜索结果 · <b>${esc(q)}</b></div>`;
  if(!entries.length){
    html += `<div class="sr-none">没有找到与「${esc(q)}」相关的网页。</div>`;
  }else{
    html += `<div class="sr-list">` + entries.map(e=>{
      const rt = PAGE_ROUTE[e.p]; const file = rt?rt[0]:''; const anchor = rt?rt[1]:'';
      const url = file + (anchor?('#'+anchor):'');
      return `<div class="sr" onclick="openResult('${e.p}')">
        <div class="sr-t">${esc(e.k[0])}</div>
        <div class="sr-u">${esc(url)}</div>
        <div class="sr-d">${esc(siteNameOf(file))} · 点击进入查看</div></div>`;
    }).join('') + `</div>`;
    html += `<div class="sr-tip">这些结果都来自你读到的正文关键词。点上面的标题，会在本窗口打开对应网页；网页里又有新词，再拿回来搜，一层层往下挖。</div>`;
  }
  pageEl.innerHTML = html;
  window.scrollTo(0,0);
  setAddr('search: '+q);
}
function showResults(q, entries){
  lastEntries = entries;
  applyResults(q, entries);
  if(entries.length && log.indexOf('✓ '+q)===-1){ log.unshift('✓ '+q); if(log.length>60) log.length=60; }
  syncLog();
  pushHistory({kind:'results', q, entries});
  updateProgress();
}
function openResult(p){
  const e = lastEntries.find(x=>x.p===p); if(!e) return;
  const rt = PAGE_ROUTE[p]; if(!rt) return;
  const file = rt[0], anchor = rt[1]||'';
  const url = file + '?node=' + encodeURIComponent(p) + (anchor?('#'+anchor):'');
  window.open(url, '_blank', 'noopener');
}

/* ====================== 8. 历史 / 导航 ====================== */
function pushHistory(v){
  if(hi < hist.length-1) hist = hist.slice(0, hi+1);
  hist.push(v); hi = hist.length-1;
  syncNavBtns();
}
function syncNavBtns(){
  document.getElementById('backbtn').disabled = hi<=0;
  document.getElementById('fwdbtn').disabled = hi>=hist.length-1;
}
function applyView(v){
  if(v.kind==='results'){ lastEntries=v.entries||[]; applyResults(v.q, v.entries||[]); }
  else applyHome();
}
function goBack(){ if(hi>0){ hi--; applyView(hist[hi]); syncNavBtns(); } }
function goFwd(){ if(hi<hist.length-1){ hi++; applyView(hist[hi]); syncNavBtns(); } }

/* ====================== 9. 主检索入口 ====================== */
function doSearch(raw){
  const q=(raw||'').trim(); if(!q) return;
  if(SITES[q]){ const s=SITES[q]; window.open(s[0]+'?node='+encodeURIComponent(s[1]), '_blank', 'noopener'); return; }
  const entries = matchAll(q);
  showResults(q, entries);   // 命中→结果列表（点链接在新标签打开）；未命中→"未收录"结果页
}
