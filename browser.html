/* ====================== 5. 检索匹配 ======================
 * 幕次由已到达的真相页推算；背景词一旦失效就**彻底搜不到**，
 * 并返回专门的「已移除」结果页 —— 让玩家明确感到东西被拿走了。
 * ========================================================================= */
function curAct(){
  let a=0;
  for(const id of found){
    const m=/^T(\d+)$/.exec(id); if(!m) continue;
    const n=+m[1];
    for(let i=0;i<ACT_RANGE.length;i++){ const r=ACT_RANGE[i];
      if(n>=r[0]&&n<=r[1]){ if(i+1>a) a=i+1; break; } }
  }
  return a;
}
function isExpired(e){ return !!e.until && curAct()>=e.until; }
function liveCount(){
  let n=0; for(const e of SEARCH_INDEX){ if(e.p && e.p.charAt(0)==='S' && !isExpired(e)) n++; }
  return n;
}
function matchAll(q){
  q=(q||'').trim(); if(!q) return [];
  const out=[]; const seen=new Set();
  for(const e of SEARCH_INDEX){
    if(isExpired(e)) continue;
    let hit=false;
    for(const k of e.k){ if(k===q || q.includes(k) || k.includes(q)){ hit=true; break; } }
    if(hit){ if(seen.has(e.p)) continue; seen.add(e.p); out.push(e); }
  }
  out.sort((a,b)=> rank(b,q)-rank(a,q));
  return out;
}
function rank(e,q){ return e.k.some(k=>k===q)?2:(e.k.some(k=>q.includes(k)||k.includes(q))?1:0); }
function expiredMatch(q){
  q=(q||'').trim(); if(!q) return null;
  for(const e of SEARCH_INDEX){ if(!e.until) continue;
    for(const k of e.k){ if(k===q || q.includes(k) || k.includes(q)) return e; } }
  return null;
}

function applyView(v){
  if(v.kind==='results'){ lastEntries=v.entries||[]; applyResults(v.q, v.entries||[]); }
  else if(v.kind==='removed'){ showRemoved(v.q, v.e); }
  else applyHome();
}
function goBack(){ if(hi>0){ hi--; applyView(hist[hi]); syncNavBtns(); } }
function goFwd(){ if(hi<hist.length-1){ hi++; applyView(hist[hi]); syncNavBtns(); } }

/* ====================== 9. 主检索入口 ====================== */
function doSearch(raw){
  const q=(raw||'').trim(); if(!q) return;
  const entries = matchAll(q);
  if(!entries.length){
    const ex = expiredMatch(q);
    if(ex){ showRemoved(q, ex); return; }
  }
  showResults(q, entries);
}

/* ====================== 10. 跨标签页进度同步 ====================== */
window.addEventListener('storage', function(e){
  if(e.key!=='wushi_v1') return;
  try{
    found.clear();
    const raw=localStorage.getItem('wushi_v1');
    if(raw){ const d=JSON.parse(raw); if(Array.isArray(d.f)) d.f.forEach(x=>found.add(x)); }
  }catch(_){}
  updateProgress();
});

/* ====================== 11. 浮层 / 日志 / 帮助 ====================== */
function openMap(){ window.open('map.html','_blank','noopener'); }
function openLog(){ syncLog(); document.getElementById('logov').classList.add('show'); }
function syncLog(){
  const txt = log.length ? log.join('\n') : '（暂无检索记录）';
  const l2=document.getElementById('loglist2'); if(l2) l2.textContent=txt;
  saveProgress();
}
function helpHint(){
  document.getElementById('helphint').innerHTML = `
    <h3>这是什么</h3>
    <p>一个用「上网查资料」包装的叙事解谜。你是沅川的一个普通网友，在这个浏览器里输入关键词、打开一个个网页，把一座已经撤并的小镇从网上拼回来。</p>
    <h3>怎么玩</h3>
    <p>· 顶部地址/搜索栏输入<b>网站名</b>，会在新标签页打开对应站点；<br>· 输入你在网页正文里读到的<b>名词</b>，本页先列出搜索结果；<br>· 点结果标题，在新标签页打开对应网页（不覆盖当前页）。<br>· 「← →」页内翻页，「⌂」回起始页，「探索地图」看进度。</p>
    <h3>注意</h3>
    <p>索引不是一成不变的。有些东西，过些日子就搜不到了。</p>`;
  document.getElementById('helpov').classList.add('show');
}
let toastTimer=null;
function toast(msg){ const t=document.getElementById('toast'); if(!t) return; t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2200); }

/* 重新开始：清空全部游戏进度（已访问界面 / 检索日志），并重新锁定机密档案室 */
function restartGame(){
  if(!confirm('确定清空游戏进度（已访问界面、检索日志），并重新锁定机密档案室吗？此操作不可撤销。')) return;
  try{
    localStorage.removeItem('wushi_v1');          /* 探索进度 */
  }catch(e){}
  found.clear();
  log.length = 0;
  syncLog();
  updateProgress();
  renderHome();
  toast('已清空进度，重新开始');
}

/* ====================== 12. 初始化 ====================== */
document.querySelectorAll('[data-close]').forEach(b=>{ b.addEventListener('click', ()=>{ const o=document.getElementById(b.dataset.close); if(o) o.classList.remove('show'); }); });
document.querySelectorAll('.ov').forEach(o=>{ o.addEventListener('click', e=>{ if(e.target===o) o.classList.remove('show'); }); });

loadProgress(); syncLog(); updateProgress();
(function(){
  const m=location.search.match(/[?&]q=([^&]*)/);
  if(m){ const q=decodeURIComponent(m[1]); if(q) setTimeout(()=>doSearch(q),80); }
  else renderHome();
})();
</script>
