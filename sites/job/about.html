<style>:root{--c:#2B7DE0;--bg:#f4f6f8}

.card{background:#fff;border:1px solid #e3e6ea;border-radius:6px;padding:16px 18px;margin-bottom:14px}

ul.ls li:last-child{border-bottom:0}
ul.ls .t{flex:1}

.meta{font-size:12px;color:#98a0aa;margin:4px 0 12px}
.pager{font-size:13px;color:#8a929c;margin:14px 0}
.footnav{border-top:1px solid #e3e6ea;background:#fff;padding:12px 18px;font-size:13px;color:#5c6773;display:flex;gap:14px;flex-wrap:wrap}
.backbar{position:fixed;left:0;right:0;bottom:0;background:var(--c);color:#fff;text-align:center;padding:8px 0;font-size:13px;cursor:pointer;letter-spacing:.06em;z-index:9}
.kw{font-weight:700;color:inherit}
.kw{cursor:default}
.thumb{width:150px;aspect-ratio:4/3;background:#eceff4;overflow:hidden;border-radius:3px;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover}
.item{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:12px 0;border-bottom:1px dashed #e8eaee}
.item:last-child{border-bottom:0}
.it-t{font-size:16px;font-weight:600}
.it-d{font-size:13px;color:#6d7680;margin-top:4px}
.it-p{color:#d96b3c;font-weight:700;margin-top:6px}
.tag{display:inline-block;font-size:11px;color:#fff;background:#a9b2bd;border-radius:3px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.price{color:#d96b3c;font-weight:700}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
