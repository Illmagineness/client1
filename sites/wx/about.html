<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>关于本号 | 怀安发布</title>
<link rel="stylesheet" href="../../assets/base.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="phone">

  <div class="topbar">
    <span class="back" onclick="loc('index')">‹</span>
    <span class="ttl">怀安发布</span>
    <span class="more">···</span>
  </div>

  <div class="acct">
    <div class="ava">怀</div>
    <div class="nm"><b>怀安发布</b><span>怀安县融媒体中心 · 官方</span></div>
    <button class="follow" onclick="this.classList.add('done');this.textContent='已关注'">+ 关注</button>
  </div>

  <div class="art">
    <h1>关于本号</h1>
    <div class="meta"><span>账号说明</span><span>· 怀安发布</span></div>

    <p>「怀安发布」是怀安县融媒体中心官方公众号，发布本地政务信息、民生资讯与历史文化内容。</p>

    <p>历史消息可按篇名在"号内搜"中查找。部分往期内容的留言功能已关闭。</p>

    <div class="box"><span class="h">关于本号</span>怀安发布为怀安县融媒体中心官方公众号，推送本地新闻、民生服务与历史文化内容。</div>
  </div>

  <div class="bot">
    <div onclick="loc('index')">📰 历史消息</div>
    <div onclick="openWxSearch()">🔍 号内搜</div>
    <div class="on">ℹ 关于</div>
  </div>
</div>

<div class="wxsearch" id="wxsearch">
  <div class="box">
    <h3>号内搜</h3>
    <input id="wxq" placeholder="输入篇名或关键词，如「永宁堤加固工程纪实」" onkeydown="if(event.key==='Enter')wxDoSearch()">
    <div class="row">
      <button class="no" onclick="document.getElementById('wxsearch').classList.remove('show')">取消</button>
      <button class="ok" onclick="wxDoSearch()">搜索</button>
    </div>
    <div class="hint">可搜本号历史消息篇名。</div>
  </div>
</div>
<div class="backbar" onclick="go('home')">↩ 回到浏览器</div>

<script>
function go(q){
  const url='../../browser.html?q='+encodeURIComponent(q);
  /* 优先直接调用浏览器的检索函数：不刷新页面，"已查阅"进度不会丢 */
  try{ if(window.parent && window.parent!==window){ window.parent.postMessage({t:'kw',q:q},'*'); return; } }catch(e){}
  window.open(url,'_blank','noopener');
}
function loc(p){ location.href=p+'.html'; }
function picMiss(img){ img.style.display='none'; }
function openWxSearch(){ const o=document.getElementById('wxsearch'); if(o){ o.classList.add('show'); setTimeout(()=>{ const i=document.getElementById('wxq'); if(i) i.focus(); },50); } }
function wxDoSearch(){ const i=document.getElementById('wxq'); if(!i) return; const v=i.value.trim(); if(!v) return; const o=document.getElementById('wxsearch'); if(o) o.classList.remove('show'); go(v); }
</script>
<script src='../../assets/nav.js'></script>
</body>
</html>
