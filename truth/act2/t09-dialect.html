  <div class="meta">柳津方言语音库 · 条目 WS-044 · 采集于 2015-11</div>
  <p class="noind" style="font-family:Consolas,monospace">▶ 播放　00:04:12 / 00:04:12</p>
  <p class="noind">——（转写）采集人：请念一下册子上的名字。<br>男声：好。<br>——（男声开始逐个念名字，语速平稳，共 43 个）<br>——（第 44 次开口时，录音中断）</p>
  <div class="box"><span class="h">采集注记</span>发音人时年 32 岁，乌石镇广播站职工。本条目录入时发音人额外念了 43 个名字，未在采集单内。所念名单与"外出务工名单"重合 43/43。</div>
  <p>该发音人其后未再参与采集。同期学校的 <b class="kw">七班毕业照</b> 中亦有此人。</p>
