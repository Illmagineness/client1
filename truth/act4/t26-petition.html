  <p class="noind"><b>信访事项答复意见书</b></p>
  <p>柳信复〔2017〕08 号</p>
  <p>您反映的"关于乌石镇周砚生下落"的事项已收悉。经查，<b>乌石镇无此人</b>。</p>
  <p>如对本意见不服，可自收到之日起 30 日内向上一级机关提出复查申请。</p>
  <p class="noind" style="text-align:right">柳津县人民政府信访局<br>2017 年 4 月 11 日</p>
  <div class="note">本件答复所附"查无此人"证明，出具单位为乌石镇派出所（已于 2016 年撤并）。</div>
  <p>同年，网上可查到的与周砚生有关的记录仅剩一份<b class="kw">已还乡者名录</b>。</p>
