  <pre>乌石乡贤互助会　三更礼　仪程

一、三更起，堂内点灯七盏，灯不得背风。
二、诵《<b class="kw">还乡经</b>》全七页，"记名者"逐页翻。
三、行<b class="kw">落钥礼</b>：各人自门取钥，倒挂于胸前。
四、点名。"记名者"唱名，唱到者答"在"。
五、不应答者，即为已还乡，当场录名。
六、钟鸣一声，礼毕。<b class="kw">归钟</b>只鸣一声。</pre>
