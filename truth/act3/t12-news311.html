  <h1>三一一</h1>
  <div class="meta">沅川日报网 · 2016-03-13 A2 版</div>
  <p class="noind" style="font-size:21px;font-weight:700">乌石镇 43 名群众外出务工，已取得联系</p>
  <p class="noind" style="color:var(--dim);font-size:13px">记者　本报讯</p>
  <p>本报讯　3 月 11 日，柳津县乌石镇 43 名群众结伴外出务工。经镇工作组逐一联系，目前已全部取得联系，情况稳定。</p>
  <p>通报称，此次外出务工系群众自发组织，不涉及任何突发事件。镇党委、镇政府已安排专人对接，做好服务保障。</p>
  <div class="note">编者注：本报道见报次日，乌石镇行政区划调整方案获县政府批复。相关附件名单见"外出务工名单"。</div>
  <div class="foot">本页为报纸版面整理稿。</div>
