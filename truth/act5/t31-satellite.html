  <h1>乌石小学</h1>
  <div class="meta">公开卫星影像 · 2016 年 3 月图层</div>
  <div class="viewer"><img src="../../pic/t30-satellite.jpg" alt="卫星影像，礼堂在小学后墙外" onerror="picMiss(this)"></div>
  <p>影像中，长方形大屋顶为<b class="kw">乌石礼堂</b>，紧邻其北即乌石小学（可辨操场跑道圆圈）。</p>
  <div class="box"><span class="h">标注</span>礼堂与小学之间无道路相连；小学后墙外有一段排水沟，沟上有踏板。</div>
  <p>2016 年 3 月 11 日 02:41，小学门禁系统记录了一次刷卡（见<b class="kw">门禁记录</b>）。</p>
  <p>礼堂后墙的小门内，据当年施工许可记载，为一间<b class="kw">地窖</b>。</p>
